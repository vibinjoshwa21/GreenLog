<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Check-ins | GreenLog</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><div th:replace="~{fragments/nav :: navigation}"></div><main>
    <div th:if="${success}" class="notice success" th:text="${success}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div>
    <div class="page-head"><div><p class="eyebrow">Survival tracking</p><h1>Check-ins</h1><p>Each submission updates the tree's current status and its drive's survival rate.</p></div></div>
    <section class="panel section" style="margin-bottom:20px"><h2>Record a check-in</h2><form method="post" th:action="@{/check-ins}"><div class="form-grid"><label>Tree<select name="treeId" required><option value="">Choose a tree</option><option th:each="tree : ${trees}" th:value="${tree.id}" th:text="${tree.species + ' · #' + tree.id + ' (' + tree.status + ')'}"></option></select></label><label>Volunteer<select name="volunteerId" required><option value="">Choose a volunteer</option><option th:each="volunteer : ${volunteers}" th:value="${volunteer.id}" th:text="${volunteer.name}"></option></select></label><label>Status<select name="status" required><option value="ALIVE">Alive</option><option value="DEAD">Dead</option></select></label><label>Checked at<input name="checkedInAt" type="datetime-local"></label><label style="grid-column:1/-1">Notes<textarea name="notes" maxlength="1000"></textarea></label></div><div class="form-actions"><button class="button" type="submit">Record check-in</button></div></form></section>
    <section class="panel section"><div class="table-wrap"><table><thead><tr><th>When</th><th>Tree</th><th>Status</th><th>Volunteer</th><th>Notes</th><th>Actions</th></tr></thead><tbody>
        <tr th:each="checkin : ${checkins}"><td th:text="${checkin.checkedInAt}">Date/time</td><td th:text="${'#' + checkin.treeId}">Tree</td><td><span class="status" th:classappend="${checkin.status}" th:text="${checkin.status}">ALIVE</span></td><td th:text="${checkin.volunteerId}">Volunteer</td><td th:text="${checkin.notes}">Notes</td><td><div class="actions"><a class="button secondary small" th:href="@{/check-ins/{id}/edit(id=${checkin.id})}">Edit details</a><form method="post" th:action="@{/check-ins/{id}/delete(id=${checkin.id})}"><button class="button danger small" type="submit">Delete</button></form></div></td></tr>
        <tr th:if="${#lists.isEmpty(checkins)}"><td colspan="6" class="empty">No check-ins recorded.</td></tr>
    </tbody></table></div></section>
</main></body></html>
